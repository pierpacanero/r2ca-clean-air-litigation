# Decap CMS configuration — Clean Air Litigation Database
#
# AUTH NOT YET ACTIVE: the `backend` block below is a placeholder.
# Activation (once, ~5 minutes): create a free site on https://decapbridge.com,
# connect this repository with a fine-grained GitHub token (Contents: read/write),
# then replace ONLY the `backend` block with the one generated by DecapBridge.
# Everything from `media_folder` down stays as it is.

backend:
  name: git-gateway
  branch: main
  # --- replace with the values generated by DecapBridge for this site ---
  identity_url: https://auth.decapbridge.com/sites/REPLACE_WITH_SITE_ID
  gateway_url: https://gateway.decapbridge.com

media_folder: "site/assets/uploads"
public_folder: "assets/uploads"

editor:
  preview: false

collections:
  - name: cases
    label: Cases
    label_singular: Case
    folder: cases
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: name
    slug: "{{fields.slug}}"
    summary: "{{name}} — {{fields.geography.country}} ({{filing_year}})"
    sortable_fields: [name, filing_year]
    fields:
      - label: "URL slug"
        name: slug
        widget: string
        pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and hyphens only (e.g. commission-v-italy-pm10)"]
        hint: "Unique identifier used in the entry's web address. Choose it once and do not change it after publication: links and citations depend on it."
      - label: "Case name"
        name: name
        widget: string
        hint: "Full case name as it should appear on the site, e.g. 'European Commission v Italian Republic (PM10)'."
      - label: "Filing year"
        name: filing_year
        widget: number
        value_type: int
        min: 1950
        max: 2100
        hint: "Year the first proceeding of the case was brought."
      - label: "Status"
        name: status
        widget: string
        hint: "Shown on the card, e.g. 'Decided', 'Pending', 'Decided — execution pending'. Use the word 'pending' for pending cases and 'enforcement' or 'execution' for enforcement stages: the status filter groups cases by these words."
      - label: "Geography (country of the facts)"
        name: geography
        widget: object
        fields:
          - label: "Country"
            name: country
            widget: string
            hint: "Country name in English, matching the map (e.g. Italy, France, United Kingdom)."
          - label: "Country code (3 digits)"
            name: iso_n3
            widget: string
            pattern: ["^[0-9]{3}$", "Exactly three digits, e.g. 380 for Italy"]
            hint: "ISO 3166-1 numeric code that links the case to the map. Full list in docs/codici-paesi.md (e.g. Italy 380, France 250, Germany 276, United Kingdom 826, Belgium 056)."
      - label: "Forum (deciding authority)"
        name: jurisdiction
        widget: object
        fields:
          - label: "Type"
            name: type
            widget: select
            options:
              - { label: "Domestic courts", value: "Domestic" }
              - { label: "Court of Justice of the EU", value: "CJEU" }
              - { label: "European Court of Human Rights", value: "ECtHR" }
          - label: "Deciding bodies"
            name: court
            widget: string
            hint: "Free text, e.g. 'Court of Justice of the European Union (Grand Chamber), on a reference from …'."
      - label: "Docket number(s)"
        name: docket
        widget: string
      - label: "At issue"
        name: at_issue
        widget: text
        hint: "One or two sentences: what the case is about."
      - label: "Abstract"
        name: abstract
        widget: text
        hint: "The original abstract of the editorial team."
      - label: "Topics"
        name: topics
        widget: list
        field: { label: Topic, name: topic, widget: string }
        hint: "Thematic keywords, e.g. PM10, Air quality plans, Enforcement."
      - label: "Proceedings"
        name: proceedings
        widget: list
        summary: "{{fields.date}} — {{fields.title}}"
        hint: "One row per procedural step, in chronological order."
        fields:
          - label: "Date (DD/MM/YYYY)"
            name: date
            widget: string
            pattern: ["^[0-9]{2}/[0-9]{2}/[0-9]{4}$", "Use the format DD/MM/YYYY, e.g. 10/11/2020"]
          - { label: "Body", name: body, widget: string }
          - { label: "Act / title", name: title, widget: string }
          - { label: "Outcome", name: outcome, widget: text }
          - { label: "Link to the act (optional)", name: link, widget: string, required: false }
      - label: "Sources"
        name: sources
        widget: list
        summary: "{{fields.label}}"
        fields:
          - { label: "Citation / label", name: label, widget: string }
          - { label: "URL (optional)", name: url, widget: string, required: false }
